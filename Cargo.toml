[package]
name = "chertmem"
# Unpublished until the first release (T18).
version = "0.0.0"
edition = "2024"
# The fleet pin: nixpkgs-lock (nixos-26.05) carries rustc 1.95.
rust-version = "1.95"
license = "MIT"
description = "Persistent, partitioned memory for coding agents"
repository = "https://github.com/pr0d1r2/chertmem"
readme = "README.md"
keywords = ["memory", "mcp", "agents", "sqlite", "claude-code"]
categories = ["development-tools", "command-line-utilities"]
# The crates.io tarball (dev T12): what building and licensing need, no
# spec, hook, gate or bench file. `cargo package` verifies by building
# only; the unit tests read fixtures and docs outside src/, so they run
# from the repository, not the tarball. `chertmem-dev package-list`
# gates this list.
include = [
  "src/**/*.rs",
  # The o200k subset table src/hook T14 reads with include_bytes!.
  "src/**/*.bin",
  "Cargo.toml",
  "Cargo.lock",
  "CHANGELOG.md",
  "LICENSE",
  "README.md",
  "THIRD-PARTY-NOTICES.md",
]

[[bin]]
name = "chert"
path = "src/main.rs"

[dependencies]
# `chert` verbs (src/cli C, paradigm/V29): clap MIT OR Apache-2.0,
# builder API only. No `derive`: its proc-macro tree brings
# unicode-ident (Unicode-3.0) into the build (owner 2026-10-25: take
# MIT if possible). Default features off: no color, so no anstream
# tree; help, usage, error context and suggestions kept for humans.
clap = { version = "4.6.7", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
# `chert completions` and `chert man` from the same clap definition
# (src/cli V1): both MIT OR Apache-2.0, as is roff under clap_mangen.
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
# SQLite with FTS5 compiled in (root C, src/store C). Default features
# off: `cache` pulls hashlink and foldhash (Zlib), outside the MIT-only
# deny.toml; the rest of the tree is MIT or MIT OR Apache-2.0.
# `fallible_uint` binds u64 timestamps, refusing values past i64::MAX.
rusqlite = { version = "0.41.0", default-features = false, features = [
  "bundled",
  "fallible_uint",
] }
# Hook payloads (src/hook C, src C): MIT OR Apache-2.0; from 1.0.154 its
# float printer is zmij (MIT), no longer ryu; itoa and memchr are MIT OR
# Apache-2.0. Default features: Map is a BTreeMap, so re-serialised tool
# input has sorted keys and the same bytes every run (src/hook V3).
serde_json = "1.0.154"
# Spool lines (src/store I): MIT, no dependencies; chosen before
# serde_json was allowed (owner 2026-10-24).
tinyjson = "2.5.1"
# `chert.toml` parsing (src/config C): every crate in its tree is MIT
# or MIT OR Apache-2.0, and serde_core brings no proc macro, so the
# MIT-only deny.toml holds.
toml = "1.1.8"
# `chert config set` (src/config T6): rewrites 1 key, keeping every
# other byte of the file. MIT OR Apache-2.0; it shares toml's parser,
# writer and datetime crates, adding only itself to the tree.
toml_edit = "0.25.17"
# Observation ids (src/store C): MIT; its rand tree is MIT OR Apache-2.0.
ulid = "3.0.0"
# Cold partitions (src/store T6): zstd MIT, zstd-safe and zstd-sys
# BSD-3-Clause (owner 2026-10-24), jobserver MIT OR Apache-2.0. Default
# features off: `legacy` decodes pre-1.0 frames we never write;
# `zdict_builder` trains the per-partition dictionary.
zstd = { version = "0.13.3", default-features = false, features = [
  "zdict_builder",
] }
# Exact o200k token count for injected context (src/hook C, T6), only
# with feature `bpe`: MIT. Off by default, as in itok: the default count
# is the bytes / 4 estimate, so the hook path loads no BPE table.
tiktoken-rs = { version = "0.12.1", optional = true }

[features]
# Count injected tokens exactly with o200k instead of bytes / 4.
bpe = ["dep:tiktoken-rs"]

[lints.rust]
# No FFI of our own; rusqlite carries SQLite's (SPEC.md C).
unsafe_code = "forbid"
unreachable_pub = "deny"

# Code limits, thresholds in clippy.toml; the fleet deny list, as in
# lablith (paradigm/V42).
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"

[workspace]
# `dev/` holds this repository's own gate steps and ships to nobody: a
# `publish = false` member cannot land on a consumer's PATH (dev node).
members = ["dev"]

# SQLite is C built by libsqlite3-sys; unoptimised it makes the debug test
# suite slow (the store ref-burst test appends 10^5 rows). Optimise only
# that dependency, so our own code keeps debug builds (reconcile 2).
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[dev-dependencies]
# The benchmark harness (benches T1, R1): Apache-2.0 OR MIT; its tree is
# MIT, Apache-2.0 or both, zerocopy adding BSD-2-Clause as a 3rd choice.
# Default features off: no rayon, no plotters; reports stay JSON under
# target/criterion, which benches T4's gate reads.
criterion = { version = "0.8.2", default-features = false }

# `cargo bench -p chertmem` (benches I): every suite under criterion.
[[bench]]
name = "latency"
path = "benches/latency/main.rs"
harness = false

# The same modules under libtest, so `cargo nextest run` runs the
# benches' own tests (benches V1, V2); `cargo bench` skips it.
[[bench]]
name = "latency-tests"
path = "benches/latency/lib.rs"
harness = true
test = true
bench = false
