            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - run: nix flake check --all-systems --print-build-logs
      - run: 'nix eval --raw .#packages.x86_64-darwin.default.drvPath'
  # A failed cachix push does not fail its job, so this asks the cache
  # itself for every built path, after the builds' post-job pushes.
