            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      # Push only from main: what main builds is what the cache must hold.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          # Only what was built here; sources and tarballs stay out of the cache.
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      - run: 'nix build --print-build-logs ".#packages.$SYSTEM.default"'
        env:
          SYSTEM: ${{ matrix.system }}
  # --all-systems is the point: a bare `nix flake check` skips every system
  # the runner cannot build. Systems without a runner are evaluated, so
  # they cannot rot silently.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
