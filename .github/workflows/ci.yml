---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64-linux, aarch64-linux, aarch64-darwin
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history: tdd-order reads the push range, and a later semver
          # step compares with the last release tag.
          fetch-depth: 0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      # Push what this job builds, so the next run downloads it. The flake
      # makes the fleet tools follow nixpkgs-lock; when that pin is newer
      # than theirs, their own caches never match and every runner builds
      # them from source. Fork PRs get no secret and still read the cache.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository }}
          # Only what was built here; sources and tarballs stay out of the cache.
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      - run: nix develop --command hk check --all --check
