# cargo-deny policy: the fleet policy, as in lablith and actlith
# (paradigm/V42).

# Only the four supported platforms count, so Windows-only crates pulled in
# by dependencies do not trip `multiple-versions`.
[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
# Owner 2026-10-24 (reconcile 2): BSD-3-Clause for zstd's C library
# (src/store T6 cold tier), Apache-2.0 for ryu, which serde_json needs
# (hook and MCP JSON). Both permissive and MIT-compatible. Owner
# 2026-10-25: Unicode-3.0 for unicode-ident, which every proc macro needs
# (clap derive, src/cli; paradigm/V29), as lablith allows it.
allow = ["MIT", "BSD-3-Clause", "Apache-2.0", "Unicode-3.0"]
# Allowed ahead of the crates that bring them; unmatched until then.
unused-allowed-license = "allow"
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
